[package]
name = "tarssh-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
prometheus = { version = "0.14.0", default-features = false }
rand = "0.10.3"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "net", "io-util", "time", "sync", "signal", "macros"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["test-util"] }
