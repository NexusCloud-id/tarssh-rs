# Merge this job into the existing scrape_configs list; do not replace it.
# This target assumes Prometheus runs directly on the Docker host.
scrape_configs:
  - job_name: tarssh-rs
    scrape_interval: 15s
    static_configs:
      - targets: ["127.0.0.1:9000"]
# Do not set service_name or deployment here: the application supplies them.
