name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8
      - name: Install Rust
        uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7
        with:
          components: rustfmt, clippy
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Release build
        run: cargo build --release --locked
      - name: Asset contract
        run: python3 scripts/check-assets.py
      - name: Compose contract
        env:
          TARSSH_ALLOY_URL: http://host.docker.internal:9999/loki/api/v1/push
          TARSSH_DEPLOYMENT: ci
        run: docker compose --env-file /dev/null config --quiet
