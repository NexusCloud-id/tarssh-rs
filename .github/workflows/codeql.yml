name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7
      - name: Initialize CodeQL
        uses: github/codeql-action/init@0f47cf5ea395a08f5ca3b81a506c66a63ecb648a
        with:
          languages: rust
      - name: Autobuild
        uses: github/codeql-action/autobuild@0f47cf5ea395a08f5ca3b81a506c66a63ecb648a
      - name: Analyze
        uses: github/codeql-action/analyze@0f47cf5ea395a08f5ca3b81a506c66a63ecb648a
