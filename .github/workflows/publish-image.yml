name: Publish image

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/nexuscloud-id/tarssh-rs

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      artifact-metadata: write
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Validate release tag
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Expected vMAJOR.MINOR.PATCH; got $TAG" >&2
            exit 1
          fi
          VERSION=$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n1)
          if [[ "v$VERSION" != "$TAG" ]]; then
            echo "Release tag $TAG does not match Cargo.toml version v$VERSION" >&2
            exit 1
          fi
          git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "Release tag $TAG does not point to a commit on $DEFAULT_BRANCH" >&2
            exit 1
          fi

      - name: Install Rust
        uses: dtolnay/rust-toolchain@f00cc37de62c899691b45db1cc585604520c95a7
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Release build
        run: cargo build --release --locked

      - name: Asset contract
        run: python3 scripts/check-assets.py

      - name: Compose contract
        env:
          TARSSH_ALLOY_URL: http://host.docker.internal:9999/loki/api/v1/push
          TARSSH_DEPLOYMENT: publish-check
        run: docker compose --env-file /dev/null config --quiet

      - name: Log in to GHCR
        uses: docker/login-action@5e57cd118135c172c3672efd75eb46360885c0ef
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435

      - name: Refuse existing release tag
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if docker buildx imagetools inspect "$IMAGE_NAME:$TAG" >/dev/null 2>&1; then
            echo "Refusing to overwrite existing image tag $IMAGE_NAME:$TAG" >&2
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@c1e51972afc2121e065aed6d45c65596fe445f3f
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true

      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-name: ${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
